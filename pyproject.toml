[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilora"
version = "1.0.0"
authors = [
    {name = "Temirbolatov", email = "mirajestore@gmail.com"},
]
description = "🗣️ Двусторонний переводчик карачаевского и русского языков с поддержкой OCR"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
keywords = ["karachay", "translator", "ocr", "russian", "dictionary"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "opencv-python>=4.5.0"]
dev = ["pytest>=7.0.0", "black>=22.0.0", "isort>=5.0.0", "flake8>=4.0.0"]
full = ["tilora[ocr,dev]"]

[project.urls]
Homepage = "https://github.com/thetemirbolatov-official/tilora"
Documentation = "https://github.com/thetemirbolatov-official/tilora#readme"
Repository = "https://github.com/thetemirbolatov-official/tilora"
Issues = "https://github.com/thetemirbolatov-official/tilora/issues"
"Author Telegram" = "https://t.me/thetemirbolatov"
"Author Instagram" = "https://instagram.com/thetemirbolatov"
"Author VK" = "https://vk.com/thetemirbolatov"

[project.scripts]
tilora = "tilora.cli:main"
tilora-translate = "tilora.cli:translate_cli"
tilora-ocr = "tilora.cli:ocr_cli"

[tool.setuptools.packages.find]
include = ["tilora", "tilora.*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
tilora = ["data/*.json", "data/*.md", "py.typed"]

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
