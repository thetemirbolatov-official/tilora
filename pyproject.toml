[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilora-api"
version = "1.0.0"
authors = [
    {name = "thetemirbolatov", email = "mirajestory@gmail.com"},
]
description = "Официальная библиотека API tilora.ru для перевода с/на карачаевский язык"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
keywords = ["karachay", "russian", "translation", "ocr", "nlp", "api", "tilora"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "Pillow>=9.0.0",
]

[project.urls]
"Homepage" = "https://tilora.ru"
"Documentation" = "https://tilora.ru/api.html"
"Repository" = "https://github.com/thetemirbolatov-official/tilora"
"Author VK" = "https://vk.com/thetemirbolatov"
"Author Instagram" = "https://instagram.com/thetemirbolatov"
"Author Telegram" = "https://t.me/thetemirbolatov"

[tool.setuptools.packages.find]
include = ["tilora*"]
