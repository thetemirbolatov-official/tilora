[metadata]
license_file = LICENSE
description-file = README.md

[bdist_wheel]
universal = 1

[egg_info]
tag_build = 
tag_date = 0
tag_svn_revision = 0

[aliases]
test = pytest

[tool:pytest]
collect_ignore = ['setup.py']
minversion = 7.0
norecursedirs = .git .tox .venv dist build *.egg-info

[coverage:run]
branch = True
source = tilora
omit = 
    */tests/*
    */examples/*
    */docs/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False:
