name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Запуск при создании тега v1.0.0, v1.0.1 и т.д.
  workflow_dispatch:  # Ручной запуск

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install publishing tools
        run: |
          python -m pip install --upgrade pip
          pip install twine
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: tilora ${{ github.ref_name }}
          body: |
            ## 🎉 tilora v${{ github.ref_name }}
            
            Официальная библиотека API tilora.ru
            
            ### 📦 Установка
            ```bash
            pip install tilora==${{ github.ref_name }}
            ```
            
            ### ✨ Возможности
            - Перевод текста (русский ↔ карачаевский)
            - Пакетный перевод до 50 текстов
            - Автоматическое определение языка
            - OCR и перевод с изображений
            - Кэширование запросов
            
            ### 🔧 Быстрый старт
            ```python
            from tilora import translate
            
            result = translate("привет как дела")
            print(result)  # салам къалайса
            ```
            
            ### 👨‍💻 Автор: **thetemirbolatov**
            
            | Социальная сеть | Ссылка |
            |----------------|--------|
            | 📱 ВКонтакте | [@thetemirbolatov](https://vk.com/thetemirbolatov) |
            | 📸 Instagram | [@thetemirbolatov](https://instagram.com/thetemirbolatov) |
            | ✈️ Telegram | [@thetemirbolatov](https://t.me/thetemirbolatov) |
            | 💻 GitHub | [@thetemirbolatov-official](https://github.com/thetemirbolatov-official) |
            
            ### 📄 Документация
            Полная документация доступна на [tilora.ru/api.html](https://tilora.ru/api.html)
            
            ### 📥 Скачать
            - [tilora-${{ github.ref_name }}.tar.gz](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/tilora-${{ github.ref_name }}.tar.gz)
            - [tilora-${{ github.ref_name }}-py3-none-any.whl](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/tilora-${{ github.ref_name }}-py3-none-any.whl)
            
            ---
            📝 **Лицензия**: MIT
            
            🔗 **Проект**: [tilora.ru](https://tilora.ru)
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
