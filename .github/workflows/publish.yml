name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Запуск при создании тега с префиксом v (v1.0.0)
    branches:
      - main  # Также запуск при пуше в main для проверки
  workflow_dispatch:  # Ручной запуск

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      
      - name: Run tests
        run: |
          pytest tests/ --cov=tilora --cov-report=xml
        continue-on-error: true  # Временное решение, пока нет тестов
      
      - name: Lint with flake8
        run: |
          flake8 tilora --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 tilora --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check types with mypy
        run: |
          mypy tilora --ignore-missing-imports
        continue-on-error: true

  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build packages
        run: |
          python -m build
      
      - name: Check packages
        run: |
          twine check dist/*
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-packages
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')  # Только для тегов
    environment:
      name: pypi
      url: https://pypi.org/p/tilora-api
    permissions:
      id-token: write  # Важно для доверенной публикации
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist-packages
          path: dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
          skip-existing: false

  publish-to-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'  # Только для main ветки
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tilora-api
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist-packages
          path: dist/
      
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          skip-existing: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-to-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist-packages
          path: dist/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 🎉 tilora ${{ github.ref_name }}
            
            Официальная библиотека API tilora.ru
            
            ### 📦 Установка
            ```bash
            pip install tilora==${{ github.ref_name }}
            ```
            
            ### ✨ Что нового
            - Первый официальный релиз
            - Поддержка перевода текста
            - OCR и перевод с изображений
            - Пакетная обработка
            
            ### 👨‍💻 Автор
            **thetemirbolatov**
            
            [![VK](https://img.shields.io/badge/VK-thetemirbolatov-blue)](https://vk.com/thetemirbolatov)
            [![Instagram](https://img.shields.io/badge/Instagram-thetemirbolatov-purple)](https://instagram.com/thetemirbolatov)
            [![Telegram](https://img.shields.io/badge/Telegram-thetemirbolatov-blue)](https://t.me/thetemirbolatov)
            
            ### 📄 Документация
            https://tilora.ru/api.html
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
